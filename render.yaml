# Render.com Single-Click Blueprint for Mini-DIOS Plastics (Shareable Hosted Executive Demo)
services:
  - type: web
    name: mini-dios-plastics-api
    runtime: docker
    rootDir: mini-dios-workforce/backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    disk:
      name: dios-sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: DIOS_AUDIT_DB
        value: /data/audit.db
      # Optional External PostgreSQL Persistence (Neon / Supabase / Render Postgres).
      # When unset, Mini-DIOS automatically falls back to local SQLite (data/mini_dios.db or DIOS_AUDIT_DB).
      # - key: DATABASE_URL
      #   sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DEMO_ACCESS_CODES
        value: "Executive Demo:DIOS-2026,Alexandria Plant:ALEX-2026,Riyadh Plant:KSA-2026"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_INSTANT_DEMO
        value: "false"
      - key: COPILOT_MAX_LIVE_CALLS_PER_HOUR
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: OFFLINE_MODE
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://mini-dios-plastics.onrender.com

  - type: web
    name: mini-dios-plastics
    runtime: docker
    rootDir: mini-dios-workforce/frontend
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE
        value: ""
      - key: NEXT_PUBLIC_ALLOW_INSTANT_DEMO
        value: "false"
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: mini-dios-plastics-api
          property: hostport
